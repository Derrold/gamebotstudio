name: Enable GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/sync-landing-site-dbd9

permissions:
  pages: write
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from main root with custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          echo "POST create (ignored if the site already exists)"
          gh api --method POST repos/Derrold/gamebotstudio/pages \
            -H "Accept: application/vnd.github+json" \
            --input - <<'EOF' || true
          {"build_type":"legacy","source":{"branch":"main","path":"/"}}
          EOF
          echo "PUT source and custom domain"
          gh api --method PUT repos/Derrold/gamebotstudio/pages \
            -H "Accept: application/vnd.github+json" \
            --input - <<'EOF'
          {
            "cname": "gamebotstudio.com",
            "build_type": "legacy",
            "source": {
              "branch": "main",
              "path": "/"
            }
          }
          EOF
          echo "GET site"
          gh api repos/Derrold/gamebotstudio/pages
